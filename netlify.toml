[build]
  command = "npm run build"
  publish = "dist"

# Single-page app: send all routes to index.html so deep links work.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Security headers. The CSP allows Google Fonts and hosted Supabase (*.supabase.co).
# If you use a custom Supabase domain, add it to connect-src.
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=()"
    Content-Security-Policy = "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https:; connect-src 'self' https://*.supabase.co; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'"

# Hashed build assets can be cached for a year.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
